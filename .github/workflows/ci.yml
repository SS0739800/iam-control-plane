name: CI

on:
  push:
    # sudaiv-work is where the work happens, one commit per phase; main is merged
    # at the end. Both are here because the deploy job below hangs off these tests,
    # and tests that only run on main would mean phases going live unverified.
    branches: [main, sudaiv-work]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: iam
          POSTGRES_DB: iam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Presence of this flips the integration-marked tests from skipped to run.
      IAM_TEST_DATABASE_URL: postgresql+asyncpg://iam:iam@localhost:5432/iam_test
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://iam:iam@localhost:5432/iam_test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      # requirements-saml.txt isn't installed here, it needs system libraries.
      # The docker job below is what checks that part.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy iam tests

      - name: Verify migrations apply to an empty database
        run: python -m alembic upgrade head

      # The frontend's types are generated from this file. If it's out of date,
      # those types describe an API that no longer exists.
      - name: Check the committed OpenAPI schema is up to date
        run: |
          python -m scripts.export_openapi
          git diff --exit-code openapi.json \
            || { echo "::error::openapi.json is stale. Run: python -m scripts.export_openapi"; exit 1; }

      - name: Test
        run: pytest

  web:
    name: Web — types, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Regenerate from the committed schema and fail if the result differs. This
      # is what turns a backend change that breaks the frontend into a red build
      # instead of a runtime surprise.
      - name: Check generated API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code src/lib/api-schema.d.ts \
            || { echo "::error::api-schema.d.ts is stale. Run: npm run generate:api"; exit 1; }

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  images:
    name: Images — build and the xmlsec tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The most useful check we have: this is what proves the xmlsec/lxml
      # source build still works. It is slow, and it is the reason a segfault in
      # P2 will never be a surprise.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: runtime
          build-args: GIT_SHA=${{ github.sha }}
          push: false
          # Loaded rather than discarded, because the step below runs it.
          load: true
          tags: iam-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signatures are the one part of this codebase where being wrong means
      # accepting forged logins — or issuing them — and the only part that needs
      # xmlsec. The api job cannot run these, so without this step both the reader
      # and the signer have no coverage anywhere in CI.
      #
      # Both files, not just the reader. P5 made us the thing being trusted, and a
      # signer that quietly signs the wrong element still produces logins that work.
      #
      # pytest is installed here rather than baked into the image, so the runtime
      # image stays free of test tooling.
      - name: Run the tests that need xmlsec
        run: |
          docker run --rm -u root -v "$PWD/apps/api:/srv" -w /srv iam-api:ci sh -c '
            pip install --quiet pytest==8.3.4 pytest-asyncio==0.25.0 httpx==0.28.1 &&
            python -m pytest tests/test_saml_reader.py tests/test_saml_signer.py -q
          '

      # Seconds, not minutes — no compiled dependencies. Worth having anyway: the
      # interop tests import apps/hrms/main.py directly, so a broken Dockerfile is
      # the one way this service can rot without a test noticing.
      - name: Build the demo HRMS image
        uses: docker/build-push-action@v6
        with:
          context: apps/hrms
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web bundle image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          target: build
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image that actually gets deployed. The three builds above each prove a
      # piece of it; this proves the assembled thing, which is where the interesting
      # failure lives — a frontend bundle that did not get copied in. The Dockerfile
      # asserts that one itself, so a broken deploy fails here rather than on Fly.
      - name: Build the production console image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GIT_SHA=${{ github.sha }}
          push: false
          load: true
          tags: iam-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start it and check the two things that are only true of the assembled image:
      # the frontend is served, and a deep link works. Neither is testable from the
      # API job, because there is no built bundle there.
      #
      # No database, so /api/health/ready would fail — /api/health is the one that
      # answers without touching Postgres.
      - name: Check the console image serves both halves
        run: |
          docker run -d --name console-ci -p 8000:8000 \
            -e APP_ENV=ci \
            -e SESSION_SECRET=ci-secret-not-the-placeholder \
            iam-console:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health >/dev/null && break
            sleep 1
          done
          echo "--- the API"
          curl -sf http://localhost:8000/api/health
          echo "--- the frontend"
          curl -sf http://localhost:8000/ | grep -q '<div id="root">' \
            || (echo "the bundle is not being served" && docker logs console-ci && exit 1)
          echo "--- a deep link"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/users)" = 200 \
            || (echo "deep links 404 — the SPA fallback is broken" && exit 1)
          echo "--- an unknown API path is still a 404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/nonsense)" = 404 \
            || (echo "the frontend is shadowing the API" && exit 1)
          docker rm -f console-ci

  # ---------------------------------------------------------------- deploying
  # Everything above has to pass first. That is the whole point of putting the
  # deploy here rather than pushing from a laptop: a release cannot happen unless
  # the tests, the types, the linters and the xmlsec build all agreed.
  #
  # Fly has no git integration of its own — unlike Render, it will not watch a
  # branch — so this is the piece that makes a push to main become a release.
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: [api, web, images]

    # Only a real push to the deploying branch. A pull request must never deploy:
    # it would put somebody else's unreviewed branch into production, and forks can
    # open pull requests. github.event_name is the guard that makes that impossible
    # rather than merely unlikely.
    #
    # sudaiv-work rather than main, deliberately and temporarily. Every phase lands
    # there and main is merged at the very end, so deploying from main would mean one
    # release months from now — which is not continuous deployment, it is a manual
    # deploy with extra steps.
    #
    # Move this to refs/heads/main once the project settles. That is the correct
    # end state: a branch that is deployed should be a branch that is reviewed, and
    # right now this one is neither, which is a real trade-off rather than an
    # oversight. The tests above are what makes it survivable in the meantime.
    if: github.event_name == 'push' && github.ref == 'refs/heads/sudaiv-work'

    # One at a time, and never cancelled halfway. This overrides the workflow-level
    # concurrency group, which has cancel-in-progress: true — fine for tests, wrong
    # here, because killing flyctl between "machine stopped" and "machine started"
    # is how you get an app that is down and a pipeline that says it succeeded.
    concurrency:
      group: deploy-fly
      cancel-in-progress: false

    environment:
      name: production
      url: https://iam-console.fly.dev

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # GIT_SHA is surfaced on /api/health, so a deployed machine can be traced
      # back to a commit. Without it every release reports "dev" and the only way
      # to tell what is running is to guess from timestamps.
      - name: Deploy the console
        run: flyctl deploy --remote-only --ha=false --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy the HRMS
        working-directory: apps/hrms
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy that Fly called successful can still be serving a broken app, and
      # the two failures worth catching are exactly the ones the local checks
      # cannot see: a machine that starts without reaching the database, and a
      # bundle that did not make it into the image.
      #
      # The commit check is the one that makes this more than a smoke test — it
      # proves the machine now answering is running *this* commit, not the previous
      # release that happened to survive a failed rollout.
      - name: Check what is actually running
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body=$(curl -sf https://iam-console.fly.dev/api/health) && break
            echo "not answering yet (attempt $attempt)"
            sleep 5
          done
          echo "$body"

          echo "$body" | grep -q '"git_sha":"${{ github.sha }}"' \
            || (echo "the machine is not running this commit" && exit 1)

          echo "--- the database"
          curl -sf https://iam-console.fly.dev/api/health/ready \
            || (echo "deployed but cannot reach Postgres" && exit 1)

          echo "--- the frontend"
          curl -sf https://iam-console.fly.dev/ | grep -q '<div id="root">' \
            || (echo "the bundle is missing from the image" && exit 1)

          echo "--- a deep link"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://iam-console.fly.dev/users)" = 200 \
            || (echo "deep links 404 in production" && exit 1)

          echo "--- the HRMS"
          curl -sf https://iam-hrms.fly.dev/health \
            || (echo "the HRMS is not answering" && exit 1)
