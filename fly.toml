# The console: the API and the built frontend, one app, one process.
# See docs/adr/0008-one-server-serves-both-halves-in-production.md.
#
#   fly deploy                       builds ./Dockerfile and releases it
#   fly secrets list                 what is set (names only, never values)
#   fly logs
#
# Everything secret is a fly secret, never a value in this file. This file is in
# git; secrets are not. See docs/deploy.md for the full runbook.

app = "iam-console"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Not secret, and safe to read in a pull request. APP_ENV is also baked into the
  # image, deliberately doubled up: a forgotten value here cannot leave a production
  # machine running with the development actor enabled.
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  STATIC_DIR = "/srv/static"

  # The hostname this is reachable at. Not secret, and it belongs in git precisely
  # because it is not a value to improvise: it becomes our SAML entity ID and the
  # reply URL every identity provider is registered against, so changing it means
  # re-registering everywhere.
  #
  # It defaults to http://localhost:8080, and a deployment that forgets it does not
  # fail — it publishes metadata advertising localhost, which an identity provider
  # accepts happily and then cannot reach. That happened here, and it is why this is
  # a tracked file rather than a remembered step.
  BASE_URL = "https://iam-console.fly.dev"

  # Neon's pooled endpoint (the "-pooler" host) is PgBouncer in transaction mode.
  # This is the setting that breaks things only sometimes and only under load if it
  # is wrong — asyncpg keeps prepared statements the pooler cannot honour. iam/db.py
  # switches to NullPool and turns both statement caches off when it sees this.
  DB_POOLER_MODE = "transaction"

  # Deliberately NOT setting ALLOW_PRIVATE_PROVISIONING_TARGETS.
  #
  # It was here to allow http://iam-hrms.internal:8000, and it cannot: that flag
  # relaxes only the private-address rule, while ADR 0007 refuses plain HTTP in
  # production unconditionally, with no setting to override it. The HTTP check fires
  # first and the flag never gets a say.
  #
  # So the HRMS is reached at its public https:// address instead. That is a round
  # trip out to Fly's edge and back for traffic that could have stayed inside the
  # network — the honest cost of a rule with no exceptions, and cheaper than an
  # exception that would then exist for everybody.

[processes]
  # Two processes from one image. The web machine serves requests; the worker
  # reconciles provisioning targets on a timer and serves nothing.
  #
  # Separate because they fail differently and should be scaled differently. A sweep
  # that wedges must not take the console down with it, and a console under load must
  # not delay somebody's offboarding. They share the image because they share the
  # code — reconcile() is the same function either way.
  app = "uvicorn iam.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m iam.worker"

[http_service]
  # Only the web process. The worker has no port and Fly must not health-check it as
  # though it did — a machine with nothing listening would be restarted forever.
  processes = ["app"]

  internal_port = 8000
  force_https = true

  # Kept warm. A portfolio link that takes fifty seconds to answer the first time is
  # a portfolio link nobody waits for.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  # The API, not the static files. A machine happily serving the bundle with a dead
  # database is not healthy, and /api/health/ready is the one that says so.
  path = "/api/health/ready"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  processes = ["app"]
  # xmlsec and SQLAlchemy are not free, and a first provisioning sync pushes the
  # whole entitled directory inside one request. 512MB is enough; 256 is not.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  # Smaller because it never loads xmlsec: iam.worker imports iam.provisioning, and
  # nothing on that path touches the SAML machinery. It still holds a directory's
  # worth of people in memory during a sweep, so not smaller than this.
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
