# Alembic configuration.
#
# sqlalchemy.url is intentionally absent — env.py sets it from application
# settings (ALEMBIC_DATABASE_URL, falling back to DATABASE_URL) so the
# connection string has one source of truth.
#
# Run from apps/api with the venv python:
#   .venv/Scripts/python -m alembic revision --autogenerate -m "add users"
#   .venv/Scripts/python -m alembic upgrade head
#   .venv/Scripts/python -m alembic downgrade -1

[alembic]
script_location = alembic

# Makes `from iam.config import ...` resolve when alembic runs from apps/api.
prepend_sys_path = .

# Timestamp-prefixed filenames so `ls versions/` reads in dependency order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Migrations are authored and reviewed in UTC regardless of who wrote them.
timezone = UTC

# No post_write_hooks. A formatting hook here depends on `ruff` being on PATH,
# which it is not when alembic runs as `python -m alembic` from the venv — and
# the resulting failure is confusing. Format generated migrations explicitly:
#   .venv/Scripts/ruff format alembic/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
