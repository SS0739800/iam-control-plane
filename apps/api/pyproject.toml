# Tool configuration only.
#
# Dependencies live in requirements.txt / requirements-dev.txt / requirements-saml.txt
# so there is exactly one source of truth for what gets installed. This file
# deliberately declares no [project] table and is not an installable package —
# `pythonpath` below is what makes `iam` importable under pytest.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # async correctness
    "S",        # bandit — this is a security project; keep it on
    "RUF",
]
ignore = [
    "S101",  # assert is how pytest works
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]     # hardcoded test credentials are fine
"alembic/*" = ["E501", "I001"]   # generated templates

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["pythonjsonlogger.*"]
ignore_missing_imports = true

# asyncpg ships no py.typed marker. Only tests/test_connection_urls.py imports it
# directly — to check its connect() signature, which is the thing that makes the
# sslmode rewrite necessary — but the import has to typecheck somewhere.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# These only exist inside the container: xmlsec has no Windows build, so a
# developer's venv can't have them. Without this, mypy on Windows fails on
# iam/saml/reader.py for reasons that have nothing to do with the code.
# See docs/adr/0004-build-xmlsec-from-source.md.
[[tool.mypy.overrides]]
module = ["onelogin.*", "xmlsec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Makes `import iam` work without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a reachable Postgres (set IAM_TEST_DATABASE_URL)",
]
